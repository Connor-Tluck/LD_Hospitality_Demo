<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hospitality — Web demo</title>
    <style>
      :root {
        --bar: 52px;
        --bg: #0f0f12;
        --panel: #18181c;
        --border: #2a2a32;
        --accent: #c4a96a;
        --iphone-w: 390px;
        --iphone-h: 844px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: var(--bg);
        color: #e8e6e1;
      }
      .top {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        height: var(--bar);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        gap: 12px;
      }
      .title {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hint {
        font-size: 11px;
        color: #8a8580;
        max-width: 42vw;
        text-align: right;
        line-height: 1.3;
      }
      @media (max-width: 640px) {
        .hint {
          display: none;
        }
      }
      .switch {
        display: inline-flex;
        padding: 3px;
        background: #0a0a0c;
        border-radius: 10px;
        border: 1px solid var(--border);
        flex-shrink: 0;
      }
      .switch button {
        appearance: none;
        border: none;
        background: transparent;
        color: #9a958c;
        font-size: 12px;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        white-space: nowrap;
      }
      .switch button[aria-pressed="true"] {
        background: #2c2824;
        color: var(--accent);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }
      .stage {
        position: fixed;
        top: var(--bar);
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: stretch;
        justify-content: center;
      }
      /* Web: full browser canvas */
      .stage.mode-web iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        background: #f5f2e9;
      }
      /* Simulated iPhone */
      .stage.mode-phone {
        align-items: center;
        padding: 16px;
        background: radial-gradient(ellipse 80% 60% at 50% 40%, #1f1f28 0%, var(--bg) 65%);
      }
      .device {
        position: relative;
        width: min(var(--iphone-w), calc(100vw - 32px));
        height: min(var(--iphone-h), calc(100vh - var(--bar) - 48px));
        max-height: calc(100vh - var(--bar) - 32px);
        aspect-ratio: 390 / 844;
        background: #0c0c0e;
        border-radius: 44px;
        padding: 10px;
        box-shadow:
          0 0 0 2px #2a2a30,
          0 24px 80px rgba(0, 0, 0, 0.55),
          inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      .device-bezel {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        bottom: 10px;
        border-radius: 36px;
        overflow: hidden;
        background: #000;
      }
      .dynamic-island {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        width: 96px;
        height: 28px;
        background: #0c0c0e;
        border-radius: 20px;
        z-index: 2;
        pointer-events: none;
      }
      .stage.mode-phone iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        background: #f5f2e9;
      }
      .chrome-note {
        position: fixed;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        color: #5c5852;
        text-align: center;
        max-width: 90vw;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <header class="top">
      <span class="title">Hospitality · Web demo</span>
      <div class="switch" role="group" aria-label="Presentation mode">
        <button type="button" id="btn-web" aria-pressed="true">Web</button>
        <button type="button" id="btn-phone" aria-pressed="false">Simulated iPhone</button>
      </div>
      <span class="hint">Serve the folder over HTTP — open this file, not file://</span>
    </header>
    <div class="stage mode-web" id="stage" role="presentation">
      <iframe id="app-frame" title="Hospitality" src="index.html"></iframe>
    </div>
    <template id="phone-shell">
      <div class="device" aria-hidden="true">
        <div class="dynamic-island"></div>
        <div class="device-bezel">
          <iframe title="Hospitality" src="index.html"></iframe>
        </div>
      </div>
    </template>
    <p class="chrome-note">
      Expo web export · use <code style="color: #8a8580">npm run preview:web-demo</code> then open
      <code style="color: #8a8580">/demo.html</code>
    </p>
    <script>
      (function () {
        var stage = document.getElementById("stage");
        var btnWeb = document.getElementById("btn-web");
        var btnPhone = document.getElementById("btn-phone");
        var iframeWeb = document.getElementById("app-frame");
        var template = document.getElementById("phone-shell");
        var KEY = "hospitality-web-demo-mode";

        function setMode(mode) {
          var isPhone = mode === "phone";
          btnWeb.setAttribute("aria-pressed", !isPhone ? "true" : "false");
          btnPhone.setAttribute("aria-pressed", isPhone ? "true" : "false");
          stage.className = "stage " + (isPhone ? "mode-phone" : "mode-web");
          try {
            sessionStorage.setItem(KEY, mode);
          } catch (_) {}

          if (isPhone) {
            stage.innerHTML = "";
            stage.appendChild(template.content.cloneNode(true));
          } else {
            stage.innerHTML = "";
            stage.appendChild(iframeWeb);
          }
        }

        var saved = null;
        try {
          saved = sessionStorage.getItem(KEY);
        } catch (_) {}
        if (saved === "phone") {
          setMode("phone");
        }

        btnWeb.addEventListener("click", function () {
          setMode("web");
        });
        btnPhone.addEventListener("click", function () {
          setMode("phone");
        });
      })();
    </script>
  </body>
</html>
